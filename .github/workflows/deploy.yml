name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/amitavrchy/medora-backend
  FRONTEND_IMAGE: ghcr.io/amitavrchy/medora-frontend
  APP_DIR: /opt/apps/medora
  # Frontend build-time value: target of the Next.js /api/* rewrite (internal Docker network).
  API_URL: http://medora-backend:4004

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.name == 'backend' && env.BACKEND_IMAGE || env.FRONTEND_IMAGE }}:latest
            ${{ matrix.name == 'backend' && env.BACKEND_IMAGE || env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            API_URL=${{ env.API_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare app directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR
          script: |
            set -e
            sudo mkdir -p "$APP_DIR"
            sudo chown "$(id -u):$(id -g)" "$APP_DIR"

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: ${{ env.APP_DIR }}/.incoming
          strip_components: 1

      - name: Pull, migrate and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,GHCR_USER,GHCR_TOKEN,IMAGE_TAG
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            mv -f .incoming/docker-compose.prod.yml docker-compose.yml
            rmdir .incoming 2>/dev/null || true
            if [ ! -f .env ]; then
              echo "::error::$APP_DIR/.env is missing. Create it from deploy/.env.example first."
              exit 1
            fi
            docker network inspect apps-net >/dev/null 2>&1 || docker network create apps-net
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose run --rm --no-deps -T backend prisma migrate deploy
            docker compose ps
            docker logout ghcr.io || true
            docker image prune -f
